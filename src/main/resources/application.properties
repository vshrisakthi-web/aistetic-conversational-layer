spring.application.name=conversational-layer

spring.datasource.url=jdbc:postgresql://localhost:5432/aistetic_conversational
spring.datasource.username=shrisakthi
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.profiles.active=dev

whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN}

# ---------------------------------------------------------
# Logging configuration - Task 87
# ---------------------------------------------------------

logging.level.root=INFO
logging.level.com.aistetic.conversationallayer=INFO

# ---------------------------------------------------------
# Correlation ID - Task 88
# ---------------------------------------------------------

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [CORR=%X{correlationId}] --- [%thread] %logger{36} : %msg%n

# ---------------------------------------------------------
# Swagger / OpenAPI - Task 89
# ---------------------------------------------------------

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs